<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respite</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 3000000px;
    }

    p{
        font-size: 1.5rem;
        color: transparent;
    }

    h1{
        color: aqua;
    }

    #vid {
        width: 100%;
        position: fixed;
        z-index: -1;
    }

    .prevent-select {
  -webkit-user-select: none; /* Safari */
  -ms-user-select: none; /* IE 10 and IE 11 */
  user-select: none; /* Standard syntax */
    }

</style>
<body>
    <video id="vid" src="All.mp4" playsinline></video>
    <h1><img src="Respite_Logo.png" width="1200" height="600"></h1>

<script>
const video = document.getElementById("vid");

let lastScrollY = window.pageYOffset;
let lastTime = performance.now();
let stopTimer;

// User must interact once before audio can play
document.addEventListener("click", async () => {
    try {
        if (video.paused) {
            await video.play();
            video.pause();
        }
    } catch (err) {
        console.error(err);
    }
}, { once: true });

// Handle keyboard arrow keys
document.addEventListener("keydown", (event) => {
    if (event.key === "ArrowDown") {
        event.preventDefault();

        const now = performance.now();
        const scrollAmount = 50; // Pixels to scroll per keypress
        const timeDelta = (now - lastTime) / 1000;

        if (timeDelta > 0) {
            // Play video at 1x speed for keyboard input
            if (video.paused) {
                video.play();
            }
            video.playbackRate = 1;

            // Scroll the page down
            window.scrollBy(0, scrollAmount);
        }

        clearTimeout(stopTimer);

        // Pause when key stops being pressed
        stopTimer = setTimeout(() => {
            video.pause();
        }, 100);

        lastScrollY = window.pageYOffset;
        lastTime = now;
    }
    else if (event.key === "ArrowUp") {
        event.preventDefault();

        const scrollAmount = 50;
        const rewindAmount = scrollAmount * 0.002;

        video.pause();
        video.currentTime = Math.max(0, video.currentTime - rewindAmount);

        window.scrollBy(0, -scrollAmount);

        clearTimeout(stopTimer);
        stopTimer = setTimeout(() => {
            video.pause();
        }, 100);

        lastScrollY = window.pageYOffset;
    }
});

window.addEventListener("scroll", () => {
    const now = performance.now();

    const scrollDelta = window.pageYOffset - lastScrollY;
    const timeDelta = (now - lastTime) / 1000;

    if (timeDelta > 0) {

        // SCROLLING DOWN
        if (scrollDelta > 0) {

            if (video.paused) {
                video.play();
            }

            const pixelsPerSecond = scrollDelta / timeDelta;

            // Adjust sensitivity here
            let rate = pixelsPerSecond / 500;

            rate = Math.max(0.1, Math.min(rate, 4));

            video.playbackRate = rate;
        }

        // SCROLLING UP
        else if (scrollDelta < 0) {

            video.pause();

            const rewindAmount = Math.abs(scrollDelta) * 0.002;

            video.currentTime = Math.max(
                0,
                video.currentTime - rewindAmount
            );
        }
    }

    clearTimeout(stopTimer);

    // Pause when scrolling stops
    stopTimer = setTimeout(() => {
        video.pause();
    }, 100);

    lastScrollY = window.pageYOffset;
    lastTime = now;
});
</script>
</body>
</html>
